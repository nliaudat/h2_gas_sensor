# Validation-only fixture for packages/alarm.yaml
# (run: esphome config tests/test_alarm_package.yaml)
#
# The package is not included by config.yaml's default build in a bare checkout
# (the buzzer/LED hardware is optional), so this fixture keeps it compiled and
# validated.  It includes `packages/mq8.yaml` first because the alarm package
# merges its band logic into `id: mq8` with `!extend` and reads that sensor from
# its lambda - the minimal real installation is exactly these two packages.
substitutions:
  name: alarm_pkg
  friendly_name: "Alarm package test"

esphome:
  name: ${name}
esp32:
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf
logger:
  level: INFO
external_components:
  - source:
      type: local
      path: ../components

packages:
  mq8: !include ../packages/mq8.yaml
  alarm: !include ../packages/alarm.yaml

# Validation-only fixture for packages/mics5524.yaml
# (run: esphome config tests/test_mics_package.yaml)
#
# config.yaml includes packages/mics5524.yaml; the sensor is optional hardware
# there, so this fixture keeps the package compiled and validated on its own.
substitutions:
  name: mics_pkg
  friendly_name: "MiCS package test"

esphome:
  name: ${name}
esp32:
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf
logger:
  level: INFO

# mics_5524 is built into ESPHome (pull request #21024 is merged), so the
# package needs no external_components: entry of its own.
packages:
  mics5524: !include ../packages/mics5524.yaml

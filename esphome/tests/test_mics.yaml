# Validation-only regression config for the mics_5524 platform
# (run: esphome config tests/test_mics.yaml)
#
#   * vendor model (`conversion: dfrobot`, the default) with the `pin:` sugar,
#     an EN pin, automatic calibration in clean air, the ratio/voltage
#     diagnostics and one gas sub-sensor
#   * datasheet model (`conversion: datasheet`) on a shared external sampler,
#     with explicit coefficient_a/coefficient_b, a fixed r0, rl and the RS
#     diagnostic
#   * vendor model with an explicit voltage_divider: and a pinned air_reference:
#
# The platform is built into ESPHome (pull request #21024 is merged), so this
# fixture needs no external_components: entry.
esphome:
  name: mics_test
esp32:
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf
logger:
  level: INFO
sensor:
  - platform: adc
    id: mics_ao
    name: "MiCS AO voltage"
    pin: GPIO33
    attenuation: 12db
    update_interval: never

  # vendor model on the `pin:` sugar: EN pin, automatic calibration in clean
  # air, a 1.5x divider already wired, the diagnostics and one gas
  - platform: mics_5524
    id: mics_h2
    pin: GPIO32
    adc_attenuation: 12db
    voltage_multiplier: 1.5
    adc_input_max: 3.33  # accepted trade-off of the 1.5x scaling
    vcc: 5.0
    sample_count: 4
    enable_pin:
      number: GPIO4
      inverted: true
    warmup_time: 3min
    calibration:
      delay: 3min
      sample_count: 10
      persist: false
    ratio_sensor:
      name: "MiCS ratio"
      accuracy_decimals: 4
    voltage_sensor:
      name: "MiCS AO (scaled)"
      accuracy_decimals: 3
    hydrogen:
      name: "H2 (MiCS-5524)"

  # datasheet model on a shared external sampler, with explicit coefficients,
  # a fixed r0, rl and the RS diagnostic
  - platform: mics_5524
    id: mics_co
    conversion: datasheet
    voltage: mics_ao
    vcc: 5.0
    rl: 10.0
    r0: 700
    rs_sensor:
      name: "MiCS RS"
      unit_of_measurement: kOhm
      accuracy_decimals: 2
    carbon_monoxide:
      name: "CO (MiCS-5524, datasheet model)"
      coefficient_a: 6.3
      coefficient_b: -1.1
      min_ppm: 1
      max_ppm: 1000

  # vendor model with an explicit divider and a pinned clean-air reference
  - platform: mics_5524
    id: mics_ch4
    voltage: mics_ao
    voltage_divider:  # 10k/20k -> multiplier 1.5, 3.33 V at the ADC pin
      r1: 10.0
      r2: 20.0
    adc_input_max: 3.33  # accepted trade-off of the 10k/20k divider
    vcc: 5.0
    air_reference: 4.2  # pinned clean-air reference instead of a calibration
    methane:
      name: "CH4 (MiCS-5524, divider + pinned reference)"

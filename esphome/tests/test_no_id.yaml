# Validation-only regression config (run: esphome config tests/test_no_id.yaml)
#
#   * MQ sensor without an explicit `id:` (name only)
#   * `pin:` sugar with a lowercase `gas:` and a fixed `r0:` (no calibration)
#   * `log_sensor:` mirroring the component log into a text sensor
#   * deliberately no `adc_input_max`: with the 10k/20k divider (1.5) the guard
#     logs the "3.33 V at the ADC input > 3.3 V, the top of the range may clip"
#     warning, which keeps that path covered
esphome:
  name: mq_no_id_test
esp32:
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf
logger:
  level: INFO
external_components:
  - source:
      type: local
      path: ../components
sensor:
  - platform: mq_gas_sensors
    name: "H2 without id"
    sensor_type: mq-8
    gas: h2
    pin: GPIO35
    adc_attenuation: 12db
    r0: 0.29
    voltage_multiplier: 1.5
    log_sensor: mq_no_id_logs
text_sensor:
  - platform: template
    id: mq_no_id_logs
    name: "H2 without id logs"

# Validation-only regression config (run: esphome config tests/test_no_id.yaml)
#
#   * MQ sensor without an explicit `id:` (name only)
#   * `pin:` sugar with a lowercase `gas:` and a fixed `r0:` (no calibration)
#   * `log_sensor:` as an inline text sensor (upstream changed it from an id
#     reference to a declared entity)
#   * `log_ppm: true` - the per-update `INFO` value line of the "normal mode"
#   * `adc_input_max: 3.33`: the 10k/20k divider (1.5) maps the 5 V maximum to
#     3.33 V, so the declared range has to be authoritative - that is what
#     patches/pr20896-adc-input-max.patch makes it (the merged mics_5524
#     component behaves the same way)
esphome:
  name: mq_no_id_test
esp32:
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf
logger:
  level: INFO
external_components:
  - source: github://pr#20896
    components: [mq_gas_sensors]
    refresh: always
sensor:
  - platform: mq_gas_sensors
    name: "H2 without id"
    sensor_type: mq-8
    gas: h2
    pin: GPIO35
    adc_attenuation: 12db
    r0: 0.29
    voltage_multiplier: 1.5
    adc_input_max: 3.33
    log_sensor:
      name: "H2 without id logs"
    log_ppm: true

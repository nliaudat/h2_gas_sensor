# MQ-8 hydrogen sensor + ambient temperature/humidity correction (DHT11, 1-wire).
#
# Use this package INSTEAD of packages/mq8.yaml (never together - both define
# `id: mq8`). It is mq8.yaml plus a DHT11 temperature/humidity sensor and the
# MQDataScience compensation of the RS/R0 ratio:
#
#     correction = a + c * exp(b * T)      a/b/c interpolated over RH 33..85 %
#     ratio_eff  = ratio / correction      -> ppm ~ ratio_eff^-0.688
#
# See ../../docs/temperature_humidity_correction.md for the model, the effect
# envelope (~+/-3 % indoors, up to -12 %/+11 % at the extremes) and why the
# 10 000 ppm alarm ceiling is kept absolute by default.
#
# The I2C twin of this package is packages/mq8_sht4x.yaml. The DHT11 is the
# cheap 1-wire alternative: it resolves 1 degC / 1 % RH (+/-2 degC / +/-5 % RH)
# and only covers 0..50 degC / 20..90 % RH, so the compensation it drives stays
# within its own error - use the SHT4x package when the ambient reading itself
# matters. Below 0 degC the DHT11 reports 0 degC or a read error (an error
# leaves the correction at 1.0000, the documented fail-open behaviour).
#
# Wiring
#   MQ-8:  VCC -> 5 V, GND -> GND, AO -> ADC pin through a voltage divider
#          (the AO output can reach 5 V, the ESP32 ADC stops at ~3.1 V).
#   DHT11: VCC -> 3.3 V, GND -> GND, DATA -> `mq8_dht11_pin` with a 4.7k - 10k
#          pull-up to 3.3 V (bare 3-pin sensors need it; ESPHome enables the
#          internal pull-up as well). Power it from 3.3 V: a 5 V module whose
#          pull-up sits on 5 V would drive the GPIO past its 3.6 V absolute
#          maximum. `mq8_dht11_pin` must be a bidirectional GPIO - GPIO34-39 can
#          only read and cannot drive the 1-wire start pulse.
#   The DHT11 needs at least 1 s between reads (60 s here; the datasheet also
#   warns that fast polling heats the sensor). One read blocks with interrupts
#   disabled for about 23 ms.
#
# Calibration
#   R0 is calibrated in clean air after `calibration.delay` and stored in flash.
#   The calibration itself is uncorrected (like MQDataScience); the compensation
#   is applied to every later reading. To force a new calibration:
#       esphome: on_boot: - lambda: id(mq8).request_calibration();

substitutions:
  mq8_pin: GPIO36  # (input only pin), change to match your wiring
  mq8_divider_r1: "10.0"  # kOhm, in series with AO (top)    -> 10k/20k divider
  mq8_divider_r2: "20.0"  # kOhm, AO node to GND (bottom)    -> multiplier 1.5
  mq8_rl: "10.0"  # load resistor of the module in kOhm
  mq8_dht11_pin: GPIO27  # DATA of the ambient T/RH sensor (bidirectional GPIO)
  mq8_dht11_model: DHT11  # DHT11 / DHT22 / AM2302 / RHT03 / SI7021 (ESPHome `dht`)

sensor:
  # Ambient conditions used for the correction (see the correction_mode key
  # below). The correction model clamps RH to 33..85 % and T to -10..50 degC.
  - platform: dht
    pin: ${mq8_dht11_pin}
    model: ${mq8_dht11_model}
    update_interval: 60s
    temperature:
      id: ${name}_mq8_temperature
      name: "${friendly_name} ambient temperature"
      accuracy_decimals: 1  # the DHT11 resolves 1 degC
    humidity:
      id: ${name}_mq8_humidity
      name: "${friendly_name} ambient humidity"
      accuracy_decimals: 0  # the DHT11 resolves 1 % RH

  - platform: adc
    id: ${name}_mq8_adc
    name: "${friendly_name} MQ-8 AO voltage"
    pin: ${mq8_pin}
    attenuation: 12db
    update_interval: 30s
    accuracy_decimals: 3
    entity_category: diagnostic

  - platform: mq_gas_sensors
    id: mq8
    name: "${friendly_name} H2 (MQ-8)"
    sensor_type: MQ-8
    gas: H2
    voltage: ${name}_mq8_adc
    divider:  # 5 V * (20/30) = 3.33 V at the ADC pin
      r1: ${mq8_divider_r1}
      r2: ${mq8_divider_r2}
    # 10k/20k maps the 5 V AO maximum to 3.33 V, a hair above the ESP32 ADC's
    # 3.3 V recommended maximum: accepted here, the very top of the range may clip.
    adc_input_max: 3.33
    vcc: 5.0
    rl: ${mq8_rl}
    update_interval: 30s
    samples: 4
    sample_interval: 20ms
    warmup_time: 0s  # set to 24h for the burn-in of a brand new sensor
    # The MQ-8 saturates around 10 000 ppm = 25 % of the H2 LEL (LEL = 40 000 ppm)
    min_ppm: 0
    max_ppm: 10000
    curve: standard  # `mqdatascience` switches to their MQ-8 H2 fit (~11 % lower)
    calibration:
      ratio_in_clean_air: 70  # RS/R0 in clean air (MQ-8 datasheet)
      delay: 5min  # wait for the boot + heater stabilisation before calibrating
      samples: 50
      persist: true  # store R0 in flash and reuse it after a reboot
    # --- temperature/humidity compensation (MQDataScience Correction.cpp) ---
    temperature: ${name}_mq8_temperature
    humidity: ${name}_mq8_humidity
    correction_mode: mqdatascience
    correction_clamp: absolute  # keep the 10 000 ppm ceiling where it is
    ratio_sensor: ${name}_mq8_ratio
    rs_sensor: ${name}_mq8_rs
    correction_sensor: ${name}_mq8_correction

  # Diagnostics (remove if not needed)
  - platform: template
    id: ${name}_mq8_ratio
    name: "${friendly_name} MQ-8 RS-R0 ratio"
    accuracy_decimals: 3
    icon: mdi:chart-line
    entity_category: diagnostic

  - platform: template
    id: ${name}_mq8_rs
    name: "${friendly_name} MQ-8 RS"
    unit_of_measurement: kOhm
    accuracy_decimals: 3
    icon: mdi:omega
    entity_category: diagnostic

  # The measured RS/R0 above stays uncorrected; this is the factor that was
  # applied to it (1.0000 = uncorrected, e.g. when the DHT11 read failed).
  - platform: template
    id: ${name}_mq8_correction
    name: "${friendly_name} MQ-8 T/RH correction"
    accuracy_decimals: 4
    icon: mdi:thermometer-water
    entity_category: diagnostic

# Reference thresholds for hydrogen in battery rooms (see ../../docs/h2_thresholds.md):
#   4 000 ppm  = 10 % LEL  -> early warning
#   10 000 ppm = 25 % LEL  -> pre-alarm (sensor upper range, NFPA 855 design target)
#   20 000 ppm = 50 % LEL  -> immediate action (ventilate / stop charging)
# Alerting is best done in Home Assistant, or with an on_value automation, e.g.:
#     on_value:
#       - if:
#           condition:
#             sensor.in_range: { above: 10000 }
#           then:
#             - logger.log: "H2 pre-alarm!"

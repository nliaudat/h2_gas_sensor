# MiCS-5524 trace-gas sensor (analog module, 5 V / GND / A0 / EN).
#
# Role in this project: the *early warning* device for hydrogen. The MQ-8 package
# covers the 4000 - 10000 ppm band (10 - 25 % of the LEL), this one covers
# 100 - 1000 ppm (0.25 - 2.5 % of the LEL) - see docs/h2_thresholds.md.
#
# Conversion model
#   `conversion: dfrobot` is the vendor model of the DFRobot_MICS library (MIT)
#   that the Fermion module and its clones are sold for:
#       x = VCC - V_AO,  ratio = x / x_air,  ppm = (threshold - ratio) / gain
#   It needs a clean-air reference (captured below after the 3 minute warm-up) and
#   does *not* care about the board's load resistor or its exact divider, which is
#   why it is the default for unlabeled modules. `conversion: datasheet` (RS/R0
#   power law) is available as well, see docs/mics5524_conversion.md.
#
# Wiring
#   VCC -> 5 V, GND -> GND, A0 -> ADC pin through a voltage divider (the module
#   output can reach 5 V, the ESP32 ADC stops at ~3.1 V), EN -> GPIO4.
#   Most clones are *enabled* by pulling EN low, hence `inverted: true` below;
#   delete `enable_pin` if your board has no EN pad or it is already pulled up.
#
# Accuracy (read this before trusting a value)
#   The MiCS-5524 has a single output for several reducing gases (CO, H2, C2H5OH,
#   NH3, CH4); the reading cannot say which one is present and individual sensors
#   vary a lot. The community thread reports a practical floor of ~7 ppm CO with
#   the ESP32 ADC (its lowest usable reading is ~75 mV). Treat the value as an
#   estimate and keep the MQ-8 as the alarm reference.
#
# Published gases
#   The package instantiates one `mics_5524_gas_sensor` entry per gas of the
#   vendor table, all reading the same A0 through their own curve: H2 (the trace /
#   alarm reference), CO, NH3, C2H5OH and CH4. They are *views* of one mixture,
#   not five independent measurements, and only `conversion: dfrobot` works for
#   the four extra gases (only CO ships with datasheet coefficients). Every entry
#   keeps its own clean-air reference (persisted in flash, captured on the first
#   boot); the ratio / scaled-voltage / log diagnostics are linked to the H2 entry
#   only, since the ratio is identical for all five.
#
# Calibration
#   The first boot calibrates the clean-air reference after `calibration.delay`
#   (max of delay and warm-up) and stores it in flash. To force a new
#   calibration, press the "MiCS-5524 recalibrate" button in Home Assistant (it
#   refreshes all five gas entries) or use:
#       esphome: on_boot: - lambda: id(mics).request_calibration();
#   A request is deferred until `warmup_time` has elapsed and the value stays
#   `unknown` while the calibration is pending or running.
#   The calibrated value is logged ("air reference = ...") and mirrored to the
#   "${friendly_name} MiCS-5524 logs" text sensor (`log_sensor:` below) - it can
#   also be pinned with `air_reference: <value>` instead of calibrating at boot.

substitutions:
  mics_pin: GPIO36  # change to match your wiring
  mics_divider_r1: "10.0"  # kOhm, in series with A0 (top)  -> 10k/20k divider
  mics_divider_r2: "20.0"  # kOhm, A0 node to GND (bottom)  -> multiplier 1.5
  # mics_enable_pin: GPIO4  # EN of the module (LOW = enabled); remove enable_pin if unused
  mics_max_ppm: "1000"  # upper end of the vendor range for H2 (and CO)
  # Per-gas clamp of the published value - the upper end of the vendor range of
  # each gas. Only the matching entry below uses its own key, so they can be
  # tuned independently (the value is the vendor default, so the model would pick
  # the same number if the key were removed).
  mics_co_max_ppm: "1000"  # CO vendor range 1 - 1000 ppm
  mics_nh3_max_ppm: "500"  # NH3 vendor range 10 - 500 ppm
  mics_ethanol_max_ppm: "500"  # C2H5OH vendor range 10 - 500 ppm
  mics_ch4_max_ppm: "25000"  # CH4 vendor range 1000 - 25000 ppm

sensor:
  - platform: adc
    id: ${name}_mics_adc
    name: "${friendly_name} MiCS-5524 AO voltage"
    pin: ${mics_pin}
    attenuation: 12db
    # Diagnostic only: the gas entries below convert the ADC themselves on every
    # poll (`ADCSensor::sample()` takes a fresh reading), so this interval does not
    # limit the ppm refresh rate - it only paces this entity.
    update_interval: 1s
    accuracy_decimals: 3
    entity_category: diagnostic

  - platform: mics_5524_gas_sensor
    id: mics
    name: "${friendly_name} H2 trace (MiCS-5524)"
    gas: H2
    conversion: dfrobot
    voltage: ${name}_mics_adc
    divider:  # 5 V * (20/30) = 3.33 V at the ADC pin
      r1: ${mics_divider_r1}
      r2: ${mics_divider_r2}
    # 10k/20k maps the 5 V A0 maximum to 3.33 V, a hair above the ESP32 ADC's
    # 3.3 V recommended maximum: accepted here, the very top of the range may clip.
    # With an ADS1115 (no divider) remove `divider:`, set `voltage_multiplier: 1.0`
    # and `adc_input_max: 6.144` / `adc_pin_max: 6.144` instead.
    adc_input_max: 3.33
    vcc: 5.0  # module supply; the vendor model works on VCC - V_AO
    # 1 s: this trace/alarm entry is the fast one (~60 ms of ADC averaging per
    # second - the heater runs continuously, so slow polling saves nothing). The
    # four other gas views below stay at 30 s, they are the same signal.
    update_interval: 1s
    samples: 4
    sample_interval: 20ms
    warmup_time: 3min  # DFRobot's warm-up; use 24h of burn-in for a new sensor
    min_ppm: 0
    max_ppm: ${mics_max_ppm}
    # enable_pin:
    #   number: ${mics_enable_pin}
    #   inverted: true  # LOW enables the module
    calibration:
      delay: 3min  # after boot, in clean air
      samples: 10  # DFRobot averages 10 samples for the reference
      persist: true  # store the reference in flash and reuse it after a reboot
    ratio_sensor: ${name}_mics_ratio
    voltage_sensor: ${name}_mics_voltage
    # Log mirror (see the `text_sensor` / `button` blocks at the end of this
    # file).  Only the H2 entry carries the diagnostics: the ratio, the scaled
    # voltage and the log line are identical for all five gas entries.
    log_sensor: ${name}_mics_logs

  # The remaining gases of the vendor table. They read the SAME analog output
  # through their own curve, so they are four *views* of one mixture, not four
  # independent measurements - the sensor cannot tell which gas is present (see
  # the accuracy note at the top of this file). Keep the H2 entry as the alarm
  # reference and use these to see how the other gases would interpret the same
  # reading. `conversion: dfrobot` is required: only CO ships with datasheet
  # coefficients (a = 6.3, b = -1.1).  They keep the slow 30 s interval - the H2
  # entry above is the fast (1 s) alarm reference.
  - platform: mics_5524_gas_sensor
    id: mics_co
    name: "${friendly_name} CO (MiCS-5524)"
    gas: CO
    conversion: dfrobot
    voltage: ${name}_mics_adc
    divider:
      r1: ${mics_divider_r1}
      r2: ${mics_divider_r2}
    adc_input_max: 3.33
    vcc: 5.0
    update_interval: 1s
    samples: 4
    sample_interval: 20ms
    warmup_time: 3min
    min_ppm: 0
    max_ppm: ${mics_co_max_ppm}
    calibration:  # own clean-air reference, persisted once (see the H2 entry)
      delay: 3min
      samples: 10
      persist: true

  - platform: mics_5524_gas_sensor
    id: mics_nh3
    name: "${friendly_name} NH3 (MiCS-5524)"
    gas: NH3
    conversion: dfrobot
    voltage: ${name}_mics_adc
    divider:
      r1: ${mics_divider_r1}
      r2: ${mics_divider_r2}
    adc_input_max: 3.33
    vcc: 5.0
    update_interval: 1s
    samples: 4
    sample_interval: 20ms
    warmup_time: 3min
    min_ppm: 0
    max_ppm: ${mics_nh3_max_ppm}
    calibration:
      delay: 3min
      samples: 10
      persist: true

  - platform: mics_5524_gas_sensor
    id: mics_ethanol
    name: "${friendly_name} C2H5OH (MiCS-5524)"
    gas: C2H5OH
    conversion: dfrobot
    voltage: ${name}_mics_adc
    divider:
      r1: ${mics_divider_r1}
      r2: ${mics_divider_r2}
    adc_input_max: 3.33
    vcc: 5.0
    update_interval: 1s
    samples: 4
    sample_interval: 20ms
    warmup_time: 3min
    min_ppm: 0
    max_ppm: ${mics_ethanol_max_ppm}
    calibration:
      delay: 3min
      samples: 10
      persist: true

  - platform: mics_5524_gas_sensor
    id: mics_ch4
    name: "${friendly_name} CH4 (MiCS-5524)"
    gas: CH4
    conversion: dfrobot
    voltage: ${name}_mics_adc
    divider:
      r1: ${mics_divider_r1}
      r2: ${mics_divider_r2}
    adc_input_max: 3.33
    vcc: 5.0
    update_interval: 1s
    samples: 4
    sample_interval: 20ms
    warmup_time: 3min
    min_ppm: 0
    max_ppm: ${mics_ch4_max_ppm}
    calibration:  # CH4 reports 0 below 1000 ppm - that is the vendor's own floor
      delay: 3min
      samples: 10
      persist: true

  # Diagnostics (remove if not needed). The ratio is 1.0 in clean air and drops
  # as soon as a reducing gas arrives, it is the vendor model's raw quantity.
  - platform: template
    id: ${name}_mics_ratio
    name: "${friendly_name} MiCS-5524 ratio"
    accuracy_decimals: 4
    icon: mdi:chart-line
    entity_category: diagnostic
    filters:
      - throttle: 1s  # the H2 entry polls at 1 Hz, this is a diagnostic

  - platform: template
    id: ${name}_mics_voltage
    name: "${friendly_name} MiCS-5524 AO (scaled)"
    unit_of_measurement: V
    accuracy_decimals: 3
    icon: mdi:flash
    entity_category: diagnostic
    filters:
      - throttle: 1s  # the H2 entry polls at 1 Hz, this is a diagnostic

# Mirror of the H2 log (the id given by `log_sensor:` on that entry): per-update
# chain (`V_AO=... x=... ratio=... -> ... ppm`), calibration messages and
# warnings - the same text the serial console shows.  The per-update line is
# mirrored at most every 30 s (the console log keeps every line), calibration
# messages and warnings immediately; the state is the last message.  Drop the
# entity (and the `log_sensor:` key) if the recorded history is not wanted.
text_sensor:
  - platform: template
    id: ${name}_mics_logs
    name: "${friendly_name} MiCS-5524 logs"
    icon: mdi:text-box-multiple-outline
    entity_category: diagnostic

# Force a new clean-air reference.  ONLY press it with the sensor in clean air
# (the value is stored in flash and used from then on).  Every gas entry keeps
# its own reference, so the button recalibrates all five - recalibrating only
# the H2 entry would leave the other four on a stale reference.
# The component defers the request until the warm-up window (`warmup_time`) has
# ended and publishes `unknown` while the calibration is pending or running.
button:
  - platform: template
    id: ${name}_mics_recalibrate
    name: "${friendly_name} MiCS-5524 recalibrate"
    icon: mdi:refresh
    entity_category: config
    on_press:
      - lambda: |-
          id(mics).request_calibration();
          id(mics_co).request_calibration();
          id(mics_nh3).request_calibration();
          id(mics_ethanol).request_calibration();
          id(mics_ch4).request_calibration();

# Reference thresholds for hydrogen in battery rooms (see ../../docs/h2_thresholds.md):
#   100 - 300 ppm  = 0.25 - 0.75 % LEL -> trace / early detection (this sensor)
#   4 000 ppm      = 10 % LEL          -> early warning (MQ-8 package)
#   10 000 ppm     = 25 % LEL          -> pre-alarm (MQ-8 package, NFPA 855)
# Alerting is best done in Home Assistant, or with an on_value automation, e.g.:
#     on_value:
#       - if:
#           condition:
#             sensor.in_range: { above: 300 }
#           then:
#             - logger.log: "H2 trace warning"

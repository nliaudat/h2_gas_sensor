# MiCS-5524 trace-gas sensor (analog module, 5 V / GND / A0 / EN).
#
# Role in this project: the *early warning* device for hydrogen. The MQ-8 package
# covers the 4000 - 10000 ppm band (10 - 25 % of the LEL), this one covers
# 100 - 1000 ppm (0.25 - 2.5 % of the LEL) - see docs/h2_thresholds.md.
#
# Conversion model
#   `conversion: dfrobot` is the vendor model of the DFRobot_MICS library (MIT)
#   that the Fermion module and its clones are sold for:
#       x = VCC - V_AO,  ratio = x / x_air,  ppm = (threshold - ratio) / gain
#   It needs a clean-air reference (captured below after the 3 minute warm-up) and
#   does *not* care about the board's load resistor or its exact divider, which is
#   why it is the default for unlabeled modules. `conversion: datasheet` (RS/R0
#   power law) is available as well, see docs/mics5524_conversion.md.
#
# Wiring
#   VCC -> 5 V, GND -> GND, A0 -> ADC pin through a voltage divider (the module
#   output can reach 5 V, the ESP32 ADC stops at ~3.1 V), EN -> GPIO4.
#   Most clones are *enabled* by pulling EN low, hence `inverted: true` below;
#   delete `enable_pin` if your board has no EN pad or it is already pulled up.
#
# Accuracy (read this before trusting a value)
#   The MiCS-5524 has a single output for several reducing gases (CO, H2, C2H5OH,
#   NH3, CH4); the reading cannot say which one is present and individual sensors
#   vary a lot. The community thread reports a practical floor of ~7 ppm CO with
#   the ESP32 ADC (its lowest usable reading is ~75 mV). Treat the value as an
#   estimate and keep the MQ-8 as the alarm reference.
#
# Published gases
#   Upstream (`mics_5524`, merged into ESPHome) is a hub: one entry samples the single
#   analog output once per `update_interval` and every configured gas
#   (`hydrogen`, `carbon_monoxide`, `ammonia`, `ethanol`, `methane`) is published
#   as its own sub-sensor from that one reading. They are *views* of one mixture,
#   not independent measurements, and only `conversion: dfrobot` works for all
#   five (only CO ships with datasheet coefficients). The H2 sub-sensor keeps the
#   `mics` id, so the history package and the alarm reference keep working.
#
# Calibration
#   The first boot calibrates the single clean-air reference after
#   `calibration.delay` (max of delay and warm-up) and every gas converts from
#   it. Upstream exposes the runtime action `mics_5524.request_calibration` on
#   the hub, so an automation or a button can re-calibrate without a re-flash
#   (the commented block at the end of this file is that button).
#   The calibrated value is logged ("air reference = ...") - it can also be
#   pinned with `air_reference: <value>` instead of calibrating at boot.
#
# Update intervals
#   Declared once in `substitutions:` below, so the cadence of every entity of
#   this package can be read (and changed) in one place:
#   `mics_update_interval` paces the hub - and therefore every gas sub-sensor
#   (the hub samples once and converts for all five, so there is no per-gas
#   cadence upstream),
#   `mics_adc_update_interval` only the raw AO voltage entity (`never` switches
#   that entity off, the ppm values are unaffected),
#   `mics_diag_interval` the publish throttle of the inline ratio / scaled-voltage
#   diagnostics.  1 Hz for the hub is deliberate: the heater runs continuously,
#   so slower polling saves nothing - slow down the rest instead when the Home
#   Assistant recorder matters (../../docs/home_assistant_alerts.md).

substitutions:
  mics_pin: GPIO36  # change to match your wiring
  mics_divider_r1: "10.0"  # kOhm, in series with A0 (top)  -> 10k/20k divider
  mics_divider_r2: "20.0"  # kOhm, A0 node to GND (bottom)  -> multiplier 1.5
  # mics_enable_pin: GPIO4  # EN of the module (LOW = enabled); remove enable_pin if unused
  mics_max_ppm: "1000"  # upper end of the vendor range for H2 (and CO)
  # Per-gas clamp of the published value - the upper end of the vendor range of
  # each gas. Only the matching sub-sensor below uses its own key, so they can be
  # tuned independently (the value is the vendor default, so the model would pick
  # the same number if the key were removed).
  mics_co_max_ppm: "1000"  # CO vendor range 1 - 1000 ppm
  mics_nh3_max_ppm: "500"  # NH3 vendor range 10 - 500 ppm
  mics_ethanol_max_ppm: "500"  # C2H5OH vendor range 10 - 500 ppm
  mics_ch4_max_ppm: "25000"  # CH4 vendor range 1000 - 25000 ppm
  # Update intervals - the cadence of every entity of this package (see the header
  # comment).  The component's own default is 30s.
  mics_update_interval: 1s  # hub sample rate - paces all five gas sub-sensors
  mics_adc_update_interval: 1s  # raw AO voltage entity; `never` = entity off, ppm unaffected
  mics_diag_interval: 1s  # publish throttle of the inline ratio / AO (scaled) diagnostics

sensor:
  - platform: adc
    id: ${name}_mics_adc
    name: "MiCS-5524 AO voltage"
    pin: ${mics_pin}
    attenuation: 12db
    # Diagnostic only: the hub below converts the ADC itself on every poll, so
    # this interval does not limit the ppm refresh rate - it only paces this
    # entity (`never` switches the entity off without touching the ppm values).
    update_interval: ${mics_adc_update_interval}
    accuracy_decimals: 3
    entity_category: diagnostic

  - platform: mics_5524
    id: mics_hub
    voltage: ${name}_mics_adc
    voltage_divider:  # 5 V * (20/30) = 3.33 V at the ADC pin
      r1: ${mics_divider_r1}
      r2: ${mics_divider_r2}
    # 10k/20k maps the 5 V A0 maximum to 3.33 V, a hair above the ESP32 ADC's
    # 3.3 V recommended maximum: accepted here, the very top of the range may clip
    # (the component checks the divider against this declared range).  With an
    # ADS1115 instead: remove `voltage_divider:` and `adc_input_max:` (both only
    # pair with a divider or a `pin:`) and set `voltage_multiplier: 1.0`.
    adc_input_max: 3.33
    vcc: 5.0  # module supply; the vendor model works on VCC - V_AO
    conversion: dfrobot
    # The hub is the fast one (~60 ms of ADC averaging per second with the
    # defaults below; the heater runs continuously, so slow polling saves
    # nothing).  One sample converts all five gases below.
    update_interval: ${mics_update_interval}
    sample_count: 4
    warmup_time: 3min  # DFRobot's warm-up; use 24h of burn-in for a new sensor
    # enable_pin:
    #   number: ${mics_enable_pin}
    #   inverted: true  # LOW enables the module
    calibration:
      delay: 3min  # after boot, in clean air
      sample_count: 10  # DFRobot averages 10 samples for the reference
      sample_interval: 20ms
    # Diagnostics (remove if not needed). The ratio is 1.0 in clean air and drops
    # as soon as a reducing gas arrives, it is the vendor model's raw quantity.
    # Declared inline: upstream owns them instead of pointing at sensors declared
    # elsewhere, so the template entities of the local variant are gone here.
    ratio_sensor:
      name: "MiCS-5524 ratio"
      filters:
        - throttle: ${mics_diag_interval}  # diagnostic: slow this one down, not the hub
    voltage_sensor:
      name: "MiCS-5524 AO (scaled)"
      filters:
        - throttle: ${mics_diag_interval}  # diagnostic: slow this one down, not the hub
    # The gases of the vendor table. They convert the SAME reading through their
    # own curve, so they are five *views* of one mixture, not five independent
    # measurements - the sensor cannot tell which gas is present (see the
    # accuracy note at the top of this file). Keep the H2 sub-sensor (id `mics`)
    # as the alarm reference. `min_ppm` is left to the vendor floor of each gas
    # (upstream rejects `min_ppm: 0`); `max_ppm` narrows the vendor range above.
    hydrogen:
      id: mics
      name: "H2 trace (MiCS-5524)"
      max_ppm: ${mics_max_ppm}
    carbon_monoxide:
      id: mics_co
      name: "CO (MiCS-5524)"
      max_ppm: ${mics_co_max_ppm}
    ammonia:
      id: mics_nh3
      name: "NH3 (MiCS-5524)"
      max_ppm: ${mics_nh3_max_ppm}
    ethanol:
      id: mics_ethanol
      name: "C2H5OH (MiCS-5524)"
      max_ppm: ${mics_ethanol_max_ppm}
    methane:
      id: mics_ch4
      name: "CH4 (MiCS-5524)"
      max_ppm: ${mics_ch4_max_ppm}
      # CH4 reports 0 below 1000 ppm - that is the vendor's own floor

# Re-calibration without a re-flash: the hub exposes `request_calibration()` as
# the action `mics_5524.request_calibration: <hub id>`, so uncommenting the block
# below adds the button.  It samples the same clean-air reference the boot
# calibration uses - keep the module in clean air while it runs.
#
# button:
#   - platform: template
#     name: "MiCS-5524 recalibrate"
#     icon: mdi:refresh
#     on_press:
#       - mics_5524.request_calibration: mics_hub
#
# Pinning `air_reference: <value>` on the hub skips the boot calibration
# altogether.

# Reference thresholds for hydrogen in battery rooms (see ../../docs/h2_thresholds.md):
#   100 - 300 ppm  = 0.25 - 0.75 % LEL -> trace / early detection (this sensor)
#   4 000 ppm      = 10 % LEL          -> early warning (MQ-8 package)
#   10 000 ppm     = 25 % LEL          -> pre-alarm (MQ-8 package, NFPA 855)
# Alerting is best done in Home Assistant, or with an on_value automation, e.g.:
#     on_value:
#       - if:
#           condition:
#             sensor.in_range: { above: 300 }
#           then:
#             - logger.log: "H2 trace warning"

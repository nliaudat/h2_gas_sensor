---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.15
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-docstrings==1.7.0
          - pydocstyle==5.1.1
        # flake8 reads its configuration from the working directory, which
        # pre-commit sets to the git root; point it at the project config
        # explicitly, otherwise the defaults (79 columns, D103 enabled) apply
        # and the vendored script/ files get linted as well.
        args: [--config=esphome/.flake8]
        files: ^esphome/.+\.py$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args:
          - --branch=main
          - --branch=dev
          - --branch=master
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py311-plus]
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        exclude: (^|/)\.clang-(format|tidy)$
        # yamllint, like flake8, looks for its configuration in the working
        # directory only; pre-commit runs it from the git root, so the project
        # config has to be named explicitly (defaults would flag 80 columns).
        args: [--config-file=esphome/.yamllint]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v13.0.1
    hooks:
      - id: clang-format
        types_or: [c, c++]
  - repo: local
    hooks:
      - id: ci-custom
        name: ci-custom
        # Vendored copy of ESPHome's CI linter (see esphome/script/README.md).
        # The wrapper runs it from the git root with git-root-relative paths,
        # which is what the namespace, import and const checks expect; it also
        # keeps the vendored files and pcb/ out of the file list.
        entry: python esphome/script/run_ci_custom.py
        language: system
        pass_filenames: false

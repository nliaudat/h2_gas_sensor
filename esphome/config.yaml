# for flashing : press boot button for 2-3 seconds before the serial connection initialize
# After OTA update, the EN (reset) button must be pressed to run firmware
# do not use gpio12 (MTDI)

substitutions:
  name: h2_sensor
  friendly_name: "H2 sensor board"

  ### board
  board_type: az-delivery-devkit-v4  # nodemcu-32s, esp-wrover-kit

  ### The package defaults (mq8_pin: GPIO39, mics_pin: GPIO36) are the two analog
  ### pins of the PCB in pcb/ (docs/hardware.md), which pairs the MQ-8 with ADC-2
  ### and the MiCS-5524 with ADC-1.  A hand-wired setup on the older pins - MQ-8 on
  ### GPIO36, MiCS-5524 on GPIO39 - needs these two overrides instead, followed by
  ### a new clean-air calibration (the stored R0 / air reference belong to the pin
  ### that was measured before).
  # mq8_pin: GPIO36   # MQ-8 A0 on socket pin 3 (SENSOR_VP, ADC1_CH0)
  # mics_pin: GPIO39  # MiCS A0 on socket pin 4 (SENSOR_VN, ADC1_CH3)

  ### time
  TZ: "Europe/Zurich"  # timezone

external_components:
  - source:
      type: local
      path: components
    components: [mq_gas_sensors, mics_5524_gas_sensor, tsdb]  # every component folder must be listed here

# Enable logging
logger:
  level: DEBUG  # NONE / ERROR / INFO / DEBUG / VERBOSE
  # baud_rate: 0  # to disable logging via UART (fully headless)
  logs:
    text_sensor: ERROR
    homeassistant.sensor: ERROR
    uptime: ERROR
    uptime.sensor: ERROR
    wifi_signal: ERROR
    wifi_signal.sensor: ERROR
    esp32.preferences: ERROR
    internal_temperature: ERROR
    esp-idf: ERROR
    select: ERROR
    number: ERROR
    sensor: INFO
    # Gas sensor components - these keys are the ESPHome log *tags*, not the
    # entity ids: mq_gas_sensors = packages/mq8.yaml, mics_5524_gas_sensor =
    # packages/mics5524.yaml. Pinned at
    # INFO: the 30 s
    # DEBUG line with the raw values is dropped, the boot / calibration INFO
    # messages, the warnings and the errors stay. Set a tag back to DEBUG (the
    # global level - a per-tag level can only be quieter) to read it again.
    mq_gas_sensors: INFO
    mics_5524_gas_sensor: INFO
    # The history component: INFO keeps the boot banner (partition, capacity,
    # buffer pool), the warnings and the CSV dump of the "history dump" button;
    # only the per-write DEBUG lines are dropped. Set it back to DEBUG to see
    # every sync.
    tsdb: INFO

packages:
  wifi: !include packages/wifi.yaml
  # Offline HTTP surface: the captive portal and the dashboard web server of the
  # open fallback AP (packages/web.yaml, ../docs/offline_mode.md).  Comment the
  # line out to build without any HTTP server - the monitor itself does not need
  # it.
  web: !include packages/web.yaml
  board: !include packages/board.yaml
  time: !include packages/time.yaml
  sensors_others: !include packages/sensors_others.yaml
  switch: !include packages/switch.yaml
  # The MQ-8 package holds the ADC, the gas sensor and - commented - both the
  # ambient T/RH sensor examples and the MQDataScience compensation of the RS/R0
  # ratio. Uncomment the matching blocks inside the package when a T/RH sensor is
  # wired (see ../../docs/temperature_humidity_correction.md).
  mq8: !include packages/mq8.yaml
  # Local pre-alarm: RTTTL buzzer on GPIO33 + 2 x SK6812 status LEDs on GPIO19.
  # The package merges its band logic into `id: mq8` with `!extend`, so this
  # include must stay *after* `mq8:`.  Optional hardware - remove the line if
  # there is no buzzer/LED strip (see ../../docs/local_alarm.md).
  alarm: !include packages/alarm.yaml
  # MiCS-5524 trace sensor (100 - 1000 ppm H2, optional hardware):
  mics5524: !include packages/mics5524.yaml
  dht22: !include packages/dht22.yaml
  # Persistent history of the readings on a LittleFS partition (tsdb component,
  # ../../docs/data_logging.md).  The first flash after adding this package must
  # be over USB - the partition table changes.  Comment the line out for a
  # build without the history partition.
  tsdb: !include packages/tsdb.yaml
